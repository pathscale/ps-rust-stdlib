[package]
name = "unwind"
version = "0.0.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/rust.git"
edition = "2024"

[lib]
test = false
bench = false
doc = false

[dependencies]
core = { path = "../rustc-std-workspace-core", package = "rustc-std-workspace-core" }

[target.'cfg(not(all(windows, target_env = "msvc")))'.dependencies]
libc = { version = "0.2.140", features = ['rustc-dep-of-std'], default-features = false }

[target.'cfg(any(target_vendor = "apple", target_os = "linux"))'.dependencies]
unwind-rs = { version = "=0.1.1", default-features = false, optional = true }

[features]
unwind-rs = ["dep:unwind-rs"]

# Only applies for Linux and Fuchsia targets
# Static link to the in-tree build of llvm libunwind
llvm-libunwind = []

# Only applies for Linux and Fuchsia targets
# If crt-static is enabled, static link to `libunwind.a` provided by system
# If crt-static is disabled, dynamic link to `libunwind.so` provided by system
system-llvm-libunwind = []

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_arch, values("loongarch32"))']
